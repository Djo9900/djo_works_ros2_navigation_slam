amcl:
  ros__parameters:
    use_sim_time: true

    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map

    scan_topic: scan

    min_particles: 500
    max_particles: 2000

    update_min_d: 0.25
    update_min_a: 0.2

    resample_interval: 1

    transform_tolerance: 0.5

    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1

    laser_model_type: likelihood_field

    z_hit: 0.9
    z_short: 0.1
    z_max: 0.05
    z_rand: 0.05
    sigma_hit: 0.2
    lambda_short: 0.1

    tf_broadcast: true
